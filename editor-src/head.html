<title>Pianta Libera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: banco da disegno a tre colonne — attrezzi | pianta + modello | ispettore; su telefono si impila */
:root{
  --bg:#e9ece8; --panel:#f6f7f4; --line:#cdd3cc; --ink:#1d2320; --muted:#5f6a63;
  --accent:#1f6f62; --accent-ink:#ffffff; --accent-soft:#d6e8e3; --warn:#9a5b12; --danger:#a33a2b; --ok:#2f7a3c;
  --plan-bg:#fbfbf8; --plan-grid:#e8ebe5; --plan-grid-major:#d3d9d1; --plan-poche:#2a302c; --plan-room:#eef2ea;
  --plan-text:#2a302c; --plan-ghost:#b9c1b9; --plan-sel:#1f6f62; --plan-under:#6a7a8a; --plan-green:#7f9a6a;
  --f-ui:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141917; --panel:#1b211e; --line:#2e3833; --ink:#e3e8e4; --muted:#9aa8a0;
  --accent:#5bbfa9; --accent-ink:#0c1512; --accent-soft:#1f3a33; --warn:#e0a458; --danger:#e07a6a; --ok:#7cc48a;
  --plan-bg:#101412; --plan-grid:#1a201d; --plan-grid-major:#26302b; --plan-poche:#d8ded9; --plan-room:#17201c;
  --plan-text:#d8ded9; --plan-ghost:#3a4641; --plan-sel:#5bbfa9; --plan-under:#8aa0b5; --plan-green:#6f8f5c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1b211e; --line:#2e3833; --ink:#e3e8e4; --muted:#9aa8a0;
  --accent:#5bbfa9; --accent-ink:#0c1512; --accent-soft:#1f3a33; --warn:#e0a458; --danger:#e07a6a; --ok:#7cc48a;
  --plan-bg:#101412; --plan-grid:#1a201d; --plan-grid-major:#26302b; --plan-poche:#d8ded9; --plan-room:#17201c;
  --plan-text:#d8ded9; --plan-ghost:#3a4641; --plan-sel:#5bbfa9; --plan-under:#8aa0b5; --plan-green:#6f8f5c; color-scheme:dark }
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;margin:0}
*{box-sizing:border-box}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand b{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand small{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.brand-info{border:1px solid var(--line);background:none;color:var(--muted);font:500 10.5px var(--f-data);padding:1px 6px;border-radius:3px;cursor:pointer}.brand-info:hover{color:var(--ink)}
.proposal{border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);background:var(--accent-soft);border-radius:6px;padding:8px 10px;margin:6px 0 8px}.proposal p{margin:0 0 6px}
.vlist{list-style:none;padding:0;margin:6px 0;display:grid;gap:6px;font-size:12.5px}.vlist li{border-left:3px solid var(--line);padding:2px 0 2px 8px}.vlist p{margin:2px 0}
.vlist .vstate{font:500 10.5px var(--f-data);padding:0 5px;border-radius:3px;background:var(--line)}.vlist .v-approvata{border-color:#3a8f5c}.vlist .v-approvata .vstate{background:#3a8f5c;color:#fff}
.vlist .v-in-attesa{border-color:#d0462c}.vlist .v-in-attesa .vstate{background:#d0462c;color:#fff}.vlist .v-da-rivedere .vstate{background:#e0a030;color:#111}.vreply{color:var(--muted)}
.shmode{border:0;padding:0;margin:6px 0}.shmode legend{padding:0;margin-bottom:4px}
body.guest #projBtn{display:none}
button.viewtag{cursor:pointer;font:inherit;pointer-events:auto;border:0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}.owner-line{color:var(--muted);font-size:11.5px}
.owner-in{max-width:340px}
.info-links{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0 4px;font-size:13px}.info-links a{color:var(--accent)}
.help-in .credits{font-size:12px;color:var(--muted);line-height:1.5}.help-in .credits li{margin:2px 0}
.field{display:flex;align-items:center;gap:6px}
.field label,.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.inp,select.inp{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-width:0}
.inp:focus{border-color:var(--accent)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel);border:0;padding:5px 10px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.spacer{flex:1}
.main{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr var(--side-w,320px);gap:8px}
.tools{display:flex;flex-direction:column;gap:4px;overflow-y:auto;scrollbar-width:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px}
.tool{width:58px;height:52px;border:1px solid transparent;border-radius:5px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:3px 2px;position:relative;flex:none}
.tool svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6;flex:none}
.tool .tl{font-size:10.5px;line-height:1.05;letter-spacing:-.1px;text-align:center;max-width:54px;color:var(--muted);overflow-wrap:anywhere;pointer-events:none}
.tool[aria-pressed="true"] .tl{color:var(--accent);font-weight:600}
.tool:hover{background:var(--bg)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tool kbd{position:absolute;right:3px;top:2px;font-family:var(--f-data);font-size:9px;color:var(--muted)}
.tool-sep{height:1px;background:var(--line);margin:3px 2px}
.views{min-width:0;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.views[data-mode="2d"],.views[data-mode="3d"]{grid-template-columns:1fr}
.views[data-mode="2d"] #pane3d,.views[data-mode="3d"] #pane2d{display:none}
.pane{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--plan-bg)}
.pane canvas{display:block;width:100%;height:100%;touch-action:none}
.pane-tag{position:absolute;left:8px;top:8px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:color-mix(in srgb, var(--panel) 85%, transparent);padding:3px 6px;border-radius:3px;pointer-events:none}
#tag2d{display:flex;gap:2px;padding:2px;pointer-events:auto;text-transform:none;letter-spacing:0}
#tag2d .lvl{border:0;background:none;color:var(--muted);font:600 11px var(--f-ui, inherit);padding:3px 8px;border-radius:3px;cursor:pointer}
#tag2d .lvl[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
/* U8: con la pianta visibile il piano si sceglie dalle schede sopra la pianta (con «+»); il selettore in alto resta in sola vista 3D e su telefono */
body:not(.compact):has(#views:not([data-mode="3d"])) .bar .field:has(#levelSel){display:none}
.wtypes .wt-chips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:2px 0 6px}
.wtypes .wt{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 2px;display:grid;gap:1px;justify-items:center;cursor:pointer;min-height:44px}
.wtypes .wt b{font:600 13px var(--f-data)}.wtypes .wt small{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wtypes .wt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.wtypes .wt-other{display:flex;align-items:center;gap:8px}.wtypes .wt-other .inp{width:90px}
.lvl-menu{position:fixed;z-index:60;min-width:200px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.22);padding:6px;display:grid;gap:2px}
.lvl-menu b{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 8px}
.lvl-menu button{background:none;border:0;text-align:left;padding:9px 8px;border-radius:5px;font:inherit}.lvl-menu button:hover{background:var(--bg)}.lvl-menu .danger{color:var(--danger)}.lvl-menu .note{padding:4px 8px}
/* telefono e tablet: il tocco lungo apre i menu dell'editor, non la selezione del testo di iOS (barre blu) */
@media (pointer:coarse){body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body input,body textarea,body select,body [contenteditable],body .cmts p,body pre{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}}
canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.statusbar{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;gap:8px;padding:0 6px;border-top:1px solid var(--line);background:color-mix(in srgb, var(--panel) 94%, transparent);font:10.5px var(--f-data);color:var(--muted)}
.sb-left{flex:1;min-width:0;display:flex;gap:10px;overflow:hidden;white-space:nowrap}.sb-left span{overflow:hidden;text-overflow:ellipsis}.sb-left span+span{flex:none}
.sb-right{display:flex;align-items:center;gap:2px;flex:none;position:relative}
.statusbar .sb{border:1px solid transparent;background:none;color:var(--muted);font:500 10.5px var(--f-data);padding:2px 6px;border-radius:3px;cursor:pointer;white-space:nowrap}
.statusbar .sb[aria-pressed="true"]{color:var(--ink);background:var(--accent-soft);border-color:color-mix(in srgb, var(--accent) 40%, transparent)}
.statusbar select.sb{border-color:var(--line);background:var(--bg)}
.statusbar .sb-info{padding:2px 4px;white-space:nowrap}
.snapmenu{position:absolute;right:0;bottom:30px;display:flex;flex-direction:column;gap:2px;min-width:170px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.16);z-index:5}
.snapmenu .sb{text-align:left;font-size:11.5px;padding:4px 8px}
@media (max-width:700px){.sb-left span:first-child{display:none}.statusbar .sb-info{display:none}}
.ctx{position:fixed;z-index:60;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column}
.ctx button{display:flex;justify-content:space-between;gap:16px;border:0;background:none;color:var(--ink);text-align:left;padding:6px 10px;border-radius:4px;font-size:13px;cursor:pointer}
.ctx button:hover,.ctx button:focus-visible{background:var(--accent-soft)}
.ctx kbd{font:10.5px var(--f-data);color:var(--muted)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.help{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px}
.help-in{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.help-in header{display:flex;justify-content:space-between;align-items:center}.help-in h3{margin:0;font-size:16px}
.proj-in{max-width:960px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.proj{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.proj.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.proj img,.proj .ph{display:block;width:100%;aspect-ratio:8/5;object-fit:cover;background:var(--plan-grid)}
.proj figcaption{padding:8px;display:flex;flex-direction:column;gap:4px}.proj figcaption small{color:var(--muted);font-size:11px}
.proj .btns{display:flex;flex-wrap:wrap;gap:4px}.proj .btns .btn{padding:3px 8px;font-size:12px}
.pano-in{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(1200px,100%);height:min(760px,92vh);display:flex;flex-direction:column;padding:10px;gap:8px}
.pano-in header{display:flex;align-items:center;gap:10px}.pano-in header h3{margin:0;font-size:15px}.pano-in header .note{flex:1;margin:0}
#panoCv{flex:1;width:100%;min-height:0;border-radius:4px;cursor:grab;touch-action:none}
.aiq{margin:6px 0;padding-left:20px;font-size:12.5px}.aiq li{display:flex;align-items:center;gap:8px;padding:2px 0}.aiq li span{flex:1}
.aiq .btn{padding:0 6px;font-size:11px}.aiq small{font-family:var(--f-data);font-size:11px;color:var(--muted)}.aiq .q-ok{color:var(--accent)}.aiq .q-err{color:var(--danger,#b3412e)}.aiq .q-run{color:var(--ink)}
.help-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 20px;margin-top:10px}
.help-grid h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.help-grid dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:12.5px}.help-grid dd{margin:0}
.help-grid kbd{font:11px var(--f-data);border:1px solid var(--line);border-radius:3px;padding:0 4px;white-space:nowrap}
.hud{position:absolute;left:8px;bottom:8px;right:8px;font-family:var(--f-data);font-size:11px;color:var(--muted);pointer-events:none;display:flex;gap:12px;flex-wrap:wrap}
.hud span{background:color-mix(in srgb, var(--panel) 88%, transparent);padding:3px 6px;border-radius:3px}
.cam{position:absolute;right:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 90px)}
.cam .btn{padding:3px 8px;font-size:12px;background:color-mix(in srgb, var(--panel) 92%, transparent)}
.loading3d{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-family:var(--f-data);font-size:11px;background:var(--panel);border:1px solid var(--line);padding:4px 8px;border-radius:3px;color:var(--muted)}
.compare{position:absolute;inset:0;background:var(--plan-bg);display:flex;flex-direction:column;z-index:5}
.compare .stage{position:relative;flex:1;min-height:0;overflow:hidden}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.compare .after{clip-path:inset(0 0 0 var(--cut,50%))}
.compare .divider{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:2px;background:var(--accent);pointer-events:none}
.compare .ctl{display:flex;gap:8px;align-items:center;padding:8px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.compare input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.side-grip{position:absolute;left:0;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:3;touch-action:none}.side-grip:hover{background:var(--accent-soft)}
.side-head{display:none;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px;border-bottom:1px solid var(--line);cursor:move;font-size:12px;color:var(--muted);touch-action:none}.side-head .btn{padding:2px 8px;font-size:12px}
.tabs .tab-ic{flex:0 0 26px;font-size:13px}.tabs-in{display:contents}.tabs button{white-space:nowrap}
body.side-float .main{grid-template-columns:auto 1fr}
body.side-float .side{position:fixed;z-index:45;resize:both;box-shadow:0 12px 32px rgba(0,0,0,.22);min-width:260px;min-height:220px;max-width:90vw;max-height:90vh}
body.side-float .side-head{display:flex}body.side-float .side-grip,body.side-float #sideFloat{display:none}
body.side-hidden .main{grid-template-columns:auto 1fr}body.side-hidden .side{display:none}
body.viewer #tools,body.viewer #addLevel,body.viewer #projBtn,body.viewer #undoBtn,body.viewer #redoBtn,body.viewer [data-tab="import"],body.viewer [data-tab="export"],body.viewer [data-tab="ai"],body.viewer #m3Btn+select option[value="__save"]{display:none}
body.viewer .main{grid-template-columns:1fr var(--side-w,320px)}
.viewtag{margin-left:8px;padding:1px 6px;border-radius:3px;background:#d0462c;color:#fff;font-size:10.5px}
.cmts{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:12.5px}.cmts li{border:1px solid var(--line);border-radius:5px;padding:6px 8px}.cmts li.done{opacity:.6}.cmts p{margin:4px 0;white-space:pre-wrap}.cmts small{color:var(--muted)}.cmts .btns .btn{padding:2px 8px;font-size:12px}
.comp tr.cat td{font-weight:600;background:var(--bg);font-size:11.5px}.comp .price{width:72px;padding:2px 4px;font-size:12px;text-align:right}
.walkpad{display:none;position:absolute;right:10px;bottom:44px;z-index:4;grid-template-columns:repeat(3,48px);gap:6px}
body.walking .walkpad{display:grid}@media (pointer:fine){body.walking .walkpad{display:none}}
.walkpad button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);font-size:18px;touch-action:none}
.walkpad [data-wk="w"]{grid-column:2}.walkpad [data-wk="a"]{grid-column:1;grid-row:2}.walkpad [data-wk="s"]{grid-column:2;grid-row:2}.walkpad [data-wk="d"]{grid-column:3;grid-row:2}.walkpad [data-wk="ArrowLeft"]{grid-column:1;grid-row:1}.walkpad [data-wk="ArrowRight"]{grid-column:3;grid-row:1}
.mask-stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}.mask-stage canvas{grid-area:1/1;max-width:100%;max-height:100%;object-fit:contain}#mkMask{opacity:.5;cursor:crosshair;touch-action:none}
.mask-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.mask-ctl #mkPrompt{flex:1;min-width:220px}
.print-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 320px;gap:10px}#prCv{width:100%;height:100%;min-height:0;border-radius:4px}.print-info{overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
@media (max-width:760px){.print-body{grid-template-columns:1fr;grid-template-rows:1fr auto}}
@media (pointer:coarse){.tool{width:60px;height:56px}.btn{min-height:38px}.inp{font-size:16px}.seg button{min-height:38px}.tabs button{padding:12px 2px}}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:transparent;border:0;padding:9px 2px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;font-size:12.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}

.note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.note b{color:var(--ink)}
.note.warn{color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:6px}
