<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>Pianta Libera</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9ece8;color:#1d2320;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;text-align:center}
@media (prefers-color-scheme:dark){body{background:#141917;color:#e3e8e4}}button{font:inherit;padding:10px 18px;border-radius:6px;border:0;background:#1f6f62;color:#fff;margin-top:12px;cursor:pointer}</style></head>
<body><main><h1>Pianta Libera</h1><p>Per la prima apertura serve la connessione a internet.<br>Dopo, il programma funziona anche senza rete.</p>
<button id="r">Riprova</button></main>
<script>document.getElementById("r").onclick=()=>{const u=new URLSearchParams(location.search).get("url");location.href=/^https:\/\//.test(u||"")?u:"https://pianta-libera.gianpaolo-franceschini.workers.dev/";};</script></body></html>
