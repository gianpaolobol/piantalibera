name: Deploy su Cloudflare (editor + /api/render)
# Pubblica il Worker (editor statico + API di render con Workers AI) sull'account Cloudflare del proprietario.
#
# Una tantum, in GitHub → Settings → Secrets and variables → Actions → New repository secret:
#   CLOUDFLARE_API_TOKEN   token API con i permessi elencati in docs/deploy-cloudflare.md
#   CLOUDFLARE_ACCOUNT_ID  ID dell'account (pannello Cloudflare, colonna destra di «Workers & Pages»)
# Poi: Actions → «Deploy su Cloudflare» → Run workflow (o un push su main che tocca worker/, shared/, public/).
#
# Il workflow, in modo idempotente:
#   1. crea (se manca) il namespace KV RENDER_KV e ne usa l'id;
#   2. crea (se manca) il widget Turnstile per <worker>.<sottodominio>.workers.dev;
#   3. pubblica il Worker con la site key Turnstile;
#   4. imposta i segreti TURNSTILE_SECRET e IP_SALT (generato a caso una sola volta) se mancano.
# Nessun segreto passa per il repository o per i log.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", "shared/**", "public/**", ".github/workflows/deploy-cloudflare.yml"]
permissions:
  contents: read
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
env:
  WORKER: pianta-libera
  WRANGLER: npx -y wrangler@4
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Segreti presenti?
        id: pre
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Mancano CLOUDFLARE_API_TOKEN e/o CLOUDFLARE_ACCOUNT_ID nei secrets del repository: deploy saltato."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.pre.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.pre.outputs.ok == '1'
        with:
          node-version: "22"
      - name: Verifiche prima del deploy
        if: steps.pre.outputs.ok == '1'
        run: |
          node scripts/build-editor.mjs --check
          node --test tests/worker.test.mjs
      - name: Token e account
        if: steps.pre.outputs.ok == '1'
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          v=$(api https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify)
          if [ "$(echo "$v" | jq -r .success)" != "true" ]; then
            v=$(api https://api.cloudflare.com/client/v4/user/tokens/verify)
          fi
          echo "$v" | jq -r '"token: " + (.result.status // "non valido")'
          [ "$(echo "$v" | jq -r .result.status)" = "active" ] || { echo "::error::Token Cloudflare non valido o scaduto"; exit 1; }
      - name: Namespace KV
        if: steps.pre.outputs.ok == '1'
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          base=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces
          title="$WORKER-RENDER_KV"
          id=$(api "$base?per_page=100" | jq -r --arg t "$title" '.result[]? | select(.title==$t) | .id' | head -1)
          if [ -z "$id" ]; then
            r=$(api -X POST "$base" -d "{\"title\":\"$title\"}")
            id=$(echo "$r" | jq -r '.result.id // empty')
            [ -n "$id" ] || { echo "::error::Creazione KV non riuscita: $(echo "$r" | jq -c .errors)"; exit 1; }
            echo "KV creato: $title"
          else echo "KV esistente: $title"; fi
          sed -i "s/SOSTITUISCI_CON_ID_KV/$id/" worker/wrangler.toml
          grep -q "$id" worker/wrangler.toml
      - name: Sottodominio workers.dev e widget Turnstile
        if: steps.pre.outputs.ok == '1'
        id: ts
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          acc=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          sub=$(api "$acc/workers/subdomain" | jq -r '.result.subdomain // empty')
          [ -n "$sub" ] || { echo "::error::L'account non ha ancora un sottodominio workers.dev: aprilo una volta in Workers & Pages nel pannello Cloudflare"; exit 1; }
          host="$WORKER.$sub.workers.dev"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          key=$(api "$acc/challenges/widgets?per_page=50" | jq -r --arg n "$WORKER" '.result[]? | select(.name==$n) | .sitekey' | head -1)
          if [ -z "$key" ]; then
            r=$(api -X POST "$acc/challenges/widgets" -d "{\"name\":\"$WORKER\",\"domains\":[\"$host\"],\"mode\":\"managed\"}")
            key=$(echo "$r" | jq -r '.result.sitekey // empty')
            [ -n "$key" ] || { echo "::error::Creazione widget Turnstile non riuscita (serve il permesso Turnstile: Edit): $(echo "$r" | jq -c .errors)"; exit 1; }
            echo "Widget Turnstile creato per $host"
          else echo "Widget Turnstile esistente"; fi
          secret=$(api "$acc/challenges/widgets/$key" | jq -r '.result.secret // empty')
          [ -n "$secret" ] || { echo "::error::Segreto Turnstile non leggibile"; exit 1; }
          echo "::add-mask::$secret"
          echo "sitekey=$key" >> "$GITHUB_OUTPUT"
          echo "TS_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Pubblica il Worker
        if: steps.pre.outputs.ok == '1'
        run: $WRANGLER deploy --config worker/wrangler.toml --var "TURNSTILE_SITE_KEY:${{ steps.ts.outputs.sitekey }}"
      - name: Segreti del Worker (solo se mancano)
        if: steps.pre.outputs.ok == '1'
        run: |
          set -euo pipefail
          have=$($WRANGLER secret list --config worker/wrangler.toml 2>/dev/null || true)
          if ! echo "$have" | grep -q '"TURNSTILE_SECRET"'; then printf '%s' "$TS_SECRET" | $WRANGLER secret put TURNSTILE_SECRET --config worker/wrangler.toml; fi
          if ! echo "$have" | grep -q '"IP_SALT"'; then
            salt=$(openssl rand -hex 32); echo "::add-mask::$salt"
            printf '%s' "$salt" | $WRANGLER secret put IP_SALT --config worker/wrangler.toml
          fi
      - name: Controllo dal vivo
        if: steps.pre.outputs.ok == '1'
        run: |
          set -euo pipefail
          url="https://${{ steps.ts.outputs.host }}"
          for i in $(seq 1 12); do c=$(curl -fsS "$url/api/config" || true); [ -n "$c" ] && break; sleep 5; done
          echo "$c" | jq '{enabled, reason, provider, model, quota, turnstile: (.turnstile_site_key != null)}'
          [ "$(echo "$c" | jq -r .enabled)" = "true" ] || { echo "::error::Il servizio risponde ma non è attivo: $(echo "$c" | jq -r .reason)"; exit 1; }
          curl -fsS -o /dev/null "$url/" && echo "Editor: $url/"
          echo "### Pianta Libera pubblicata: $url/" >> "$GITHUB_STEP_SUMMARY"
