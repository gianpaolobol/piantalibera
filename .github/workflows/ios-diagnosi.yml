# Diagnosi dell'app iPhone: build Release per il simulatore, avvio, log e rapporti di crash nel log del job.
name: Diagnosi app iPhone
on:
  workflow_dispatch:
  push:
    branches: ["fix/ios-*"]
    paths: ["app-mobile/**", ".github/workflows/ios-diagnosi.yml"]
permissions:
  contents: read
jobs:
  simulatore:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: app-mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.3.0, cache: npm, cache-dependency-path: app-mobile/package-lock.json }
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build Release per il simulatore
        run: |
          cd ios; ws=$(ls -d *.xcworkspace | head -1); scheme=$(basename "$ws" .xcworkspace)
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 15
      - name: Avvio nel simulatore
        run: |
          app=$(find ios/build/Build/Products -maxdepth 2 -name "*.app" | head -1); echo "app: $app"
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          (xcrun simctl spawn "$udid" log stream --level debug --style compact --predicate 'process CONTAINS "Pianta" OR process CONTAINS "Libera" OR eventMessage CONTAINS "piantalibera"' > "$RUNNER_TEMP/stream.txt" 2>&1 &) 
          sleep 3
          echo "== dipendenze dinamiche del binario"; bin="$app/$(defaults read "$PWD/$app/Info" CFBundleExecutable)"; otool -L "$bin" | head -40; ls "$app/Frameworks" 2>/dev/null
          echo "== avvio diretto (messaggi di dyld)"; ( xcrun simctl launch --console-pty "$udid" it.piantalibera.app 2>&1 & pid=$!; sleep 25; kill $pid 2>/dev/null ) | grep -v "^\s*$" | head -40 || true
          sleep 45
          echo "== processo ancora vivo?"; xcrun simctl spawn "$udid" launchctl list | grep -i piantalibera || echo "NON IN ESECUZIONE (crash?)"
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/schermata.png" || true
          echo "== log (filtrato)"; grep -iE "error|exception|fatal|crash|terminat|abort|invariant|js|warn|webview|redbox" "$RUNNER_TEMP/stream.txt" | head -150
          echo "== rapporti di crash"; for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3); do echo "--- $f"; head -c 6000 "$f"; echo; done
          sips -Z 420 -s format jpeg -s formatOptions 55 "$RUNNER_TEMP/schermata.png" --out "$RUNNER_TEMP/s.jpg" >/dev/null 2>&1 && { echo "== SCHERMATA_BASE64_INIZIO"; base64 -i "$RUNNER_TEMP/s.jpg" | tr -d '\n'; echo; echo "== SCHERMATA_BASE64_FINE"; }
