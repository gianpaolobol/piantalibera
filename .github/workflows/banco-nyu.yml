# Banco su foto vere con misure vere (NYU Depth V2, profondità Kinect ed etichette): gratuito e illimitato, perché
# usa solo i modelli che girano nel dispositivo (nessuna chiamata a Workers AI). Il sottoinsieme estratto resta
# nella cache di GitHub Actions: non entra nel repository.
name: Banco foto vere (NYU)

on:
  workflow_dispatch:
    inputs:
      n: { description: "Quante foto", default: "80" }
      sonda: { description: "Sonda MoGe-2", type: boolean, default: true }
  push:
    branches: ["feature/foto-*"]
    paths: ["scripts/banco-nyu.mjs", "scripts/nyu-estrai.py", "shared/photo.js", "shared/photo-seg.js", "shared/photo-depth.js", "editor-src/077-foto3d.js", "scripts/sonda-moge.py", "scripts/esporta-moge.py", "scripts/dividi-modello.py", "scripts/sonda-rilevatore.mjs", ".github/workflows/banco-nyu.yml"]

permissions:
  contents: read

concurrency:
  group: banco-nyu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SALTA_SONDA: ${{ github.event_name == 'push' && '1' || '' }}
      SONDA_RIL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/nyu-sub
          key: nyu-sub-${{ hashFiles('scripts/nyu-estrai.py') }}
      - name: Scarica NYU Depth V2 ed estrai le foto con le misure vere
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet h5py numpy pillow
          curl -sSfL --retry 3 -o ~/nyu.mat http://horatio.cs.nyu.edu/mit/silberman/nyu_depth_v2/nyu_depth_v2_labeled.mat
          ls -la ~/nyu.mat
          python3 scripts/nyu-estrai.py ~/nyu.mat ~/nyu-sub 120
          rm ~/nyu.mat
      - name: Sonda MoGe-2 (geometria metrica da una sola foto)
        if: always()
        continue-on-error: true
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "git+https://github.com/microsoft/MoGe.git"
          [ "${{ inputs.sonda }}" = "false" ] || [ -n "$SALTA_SONDA" ] || python3 scripts/sonda-moge.py ~/nyu-sub 40 vits
      - id: onnx
        uses: actions/cache@v4
        with:
          path: ~/moge-onnx
          key: moge-onnx-${{ hashFiles('scripts/esporta-moge.py') }}
      - name: Esporta MoGe-2 in ONNX (fp32, int8) e verifica
        if: steps.onnx.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          pip install --quiet onnx onnxconverter-common onnxruntime
          python3 scripts/esporta-moge.py ~/nyu-sub ~/moge-onnx
      - run: npm ci && npx playwright install --with-deps chromium
      - run: node scripts/build-editor.mjs
      - name: Sonda rilevatori di oggetti nel dispositivo
        if: always() && env.SONDA_RIL == '1'
        continue-on-error: true
        run: npm i --no-save @huggingface/transformers@3.8.1 && node scripts/sonda-rilevatore.mjs ~/nyu-sub 60
      - name: Banco senza profondità (altezza della fotocamera indicata)
        run: node scripts/banco-nyu.mjs ~/nyu-sub ${{ inputs.n || '80' }}
      - name: Banco con la profondità nel dispositivo (nessuna misura)
        if: always()
        run: |
          python3 scripts/dividi-modello.py ~/moge-onnx/moge2-vits-560x420-q8.onnx 2 public/modelli
          MODO=profondita MODELLO=modelli/moge2-vits-560x420-q8.onnx PARTI=2 node scripts/banco-nyu.mjs ~/nyu-sub ${{ inputs.n || '80' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: moge-onnx, path: ~/moge-onnx, retention-days: 30, if-no-files-found: ignore }
