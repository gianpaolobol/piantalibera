# TestFlight (iPhone/iPad) e Google Play, con la stessa procedura di Fungo Italia: EAS di Expo.
# Account Expo «gianpaolobol», team Apple BX9MDXAHKG; le credenziali Apple e Google restano in Expo,
# mai nel repository. Serve il segreto EXPO_TOKEN in questo repository (vedi docs/app.md).
name: Store (TestFlight e Google Play)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Piattaforma
        type: choice
        options: [ios, android, all]
        default: ios
      azione:
        description: "build = nuova build firmata · invia = manda a TestFlight l'ultima build iOS già pronta · stato = elenco delle build · aab = pubblica su GitHub (release play-latest) l'ultimo AAB Android per Play Console"
        type: choice
        options: [build, invia, stato, aab]
        default: build
      submit:
        description: "Con «build»: invia a TestFlight appena pronta. Con «invia»: togliendo la spunta prepara solo il gruppo di test, senza nuovo invio"
        type: boolean
        default: true

permissions:
  contents: write   # solo per l'azione «aab»: pubblica il file nella release play-latest

concurrency:
  group: store
  cancel-in-progress: false

jobs:
  eas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: app-mobile } }
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EAS: npx -y eas-cli@24.8.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.3.0, cache: npm, cache-dependency-path: app-mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - name: Accesso a Expo
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error::Manca il segreto EXPO_TOKEN (Settings → Secrets and variables → Actions). Vedi docs/app.md"; exit 1; }
          $EAS whoami
      - name: Chiave Apple da Expo, app su App Store Connect, progetto Expo
        id: prep
        run: node scripts/store-prep.mjs
      - name: Stato delle build
        if: inputs.azione == 'stato'
        env: { EXPO_PROJECT_ID: "${{ steps.prep.outputs.project_id }}", EAS_NO_VCS: "1" }
        run: |
          $EAS build:list --limit 8 --non-interactive --json > "$RUNNER_TEMP/b.json"
          jq -r '.[] | "\(.platform)\t\(.status)\tversione \(.appVersion) (\(.appBuildVersion))\t\(.createdAt)\t\(if .platform=="ANDROID" then (.artifacts.buildUrl // "") else "" end)"' "$RUNNER_TEMP/b.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: AAB Android per Play Console nella release GitHub play-latest
        if: inputs.azione == 'aab'
        env: { EXPO_PROJECT_ID: "${{ steps.prep.outputs.project_id }}", EAS_NO_VCS: "1", GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
        run: |
          # firmato da EAS con la chiave di caricamento già registrata in Play Console: è l'unico file che Google accetta come aggiornamento
          $EAS build:list --platform android --status finished --limit 1 --non-interactive --json > "$RUNNER_TEMP/a.json"
          url=$(jq -r '.[0].artifacts.buildUrl' "$RUNNER_TEMP/a.json"); vc=$(jq -r '.[0].appBuildVersion' "$RUNNER_TEMP/a.json"); ver=$(jq -r '.[0].appVersion' "$RUNNER_TEMP/a.json")
          case "$url" in https://*.aab) ;; *) echo "::error::Nessun AAB Android pronto"; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/rel"; f="$RUNNER_TEMP/rel/Pianta-Libera-$ver-$vc.aab"
          curl -fsSL "$url" -o "$f"; (cd "$RUNNER_TEMP/rel" && sha256sum *.aab > SHA256SUMS.txt)
          notes="AAB firmato per Google Play Console, versione $ver (versionCode $vc). Da caricare in Test interni → Crea nuova release. Aggiornato con: Actions → Store → azione «aab»."
          if gh release view play-latest -R "$REPO" >/dev/null 2>&1; then
            for a in $(gh release view play-latest -R "$REPO" --json assets --jq '.assets[].name'); do gh release delete-asset play-latest "$a" -R "$REPO" -y; done
            gh release edit play-latest -R "$REPO" --title "Pianta Libera — Android per Play Console ($ver, $vc)" --notes "$notes" --prerelease
          else
            gh release create play-latest -R "$REPO" --title "Pianta Libera — Android per Play Console ($ver, $vc)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload play-latest "$RUNNER_TEMP"/rel/* -R "$REPO" --clobber
          echo "Play Console: https://github.com/$REPO/releases/download/play-latest/$(basename "$f")" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Invia a TestFlight l'ultima build iOS
        if: inputs.azione == 'invia'
        env: { EXPO_PROJECT_ID: "${{ steps.prep.outputs.project_id }}", EAS_NO_VCS: "1", ASC_APP_ID: "${{ steps.prep.outputs.asc_app_id }}", SOLO_TESTER: "${{ !inputs.submit }}" }
        run: |
          [ -n "$ASC_APP_ID" ] || { echo "::error::L'app non c'è ancora su App Store Connect (bundle it.piantalibera.app): va creata dal sito, vedi docs/app.md"; exit 1; }
          if [ "$SOLO_TESTER" != "true" ]; then $EAS submit --platform ios --latest --profile production --non-interactive --wait; fi
          echo "Inviata a TestFlight: https://appstoreconnect.apple.com/apps/$ASC_APP_ID/testflight/ios" >> "$GITHUB_STEP_SUMMARY"
      - name: TestFlight per il titolare (gruppo interno)
        if: inputs.azione == 'invia'
        env:
          ASC_APP_ID: ${{ steps.prep.outputs.asc_app_id }}
          ASC_KEY_ID: ${{ steps.prep.outputs.key_id }}
          ASC_ISSUER: ${{ steps.prep.outputs.issuer }}
        run: node scripts/testflight.mjs
      - name: Build firmata${{ inputs.submit && ' e invio' || '' }}
        if: inputs.azione == 'build'
        env:
          EAS_NO_VCS: "1"
          EXPO_PROJECT_ID: ${{ steps.prep.outputs.project_id }}
          EXPO_ASC_API_KEY_PATH: ${{ steps.prep.outputs.p8 }}
          EXPO_ASC_KEY_ID: ${{ steps.prep.outputs.key_id }}
          EXPO_ASC_ISSUER_ID: ${{ steps.prep.outputs.issuer }}
          EXPO_APPLE_TEAM_ID: BX9MDXAHKG
          EXPO_APPLE_TEAM_TYPE: ${{ steps.prep.outputs.team_type }}
          ASC_APP_ID: ${{ steps.prep.outputs.asc_app_id }}
          IOS_LOCAL: ${{ steps.prep.outputs.ios_local }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          fail=0
          for p in $( [ "$PLATFORM" = all ] && echo "android ios" || echo "$PLATFORM" ); do
            prof=production; sub=""
            if [ "$p" = ios ]; then
              [ "$IOS_LOCAL" = "true" ] && prof=production-ios-local
              [ "$SUBMIT" = "true" ] && [ -n "$ASC_APP_ID" ] && sub="--auto-submit"
            fi                                    # Android: Google vuole il primo AAB caricato a mano in Play Console
            echo "== $p ($prof) $sub"
            $EAS build --platform "$p" --profile "$prof" $sub --non-interactive --no-wait || fail=1
          done
          rm -f credentials.json
          [ "$fail" = 0 ]
          echo "### Build avviate su Expo ($PLATFORM)" >> "$GITHUB_STEP_SUMMARY"
          echo "Stato e log: https://expo.dev/accounts/gianpaolobol/projects/pianta-libera/builds" >> "$GITHUB_STEP_SUMMARY"
      - name: Rimuovi la chiave temporanea
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/app.mobileprovision" credentials.json
