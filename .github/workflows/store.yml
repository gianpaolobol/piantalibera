# TestFlight (iPhone/iPad) e Google Play, con la stessa procedura di Fungo Italia: EAS di Expo.
# Account Expo «gianpaolobol», team Apple BX9MDXAHKG; le credenziali Apple e Google restano in Expo,
# mai nel repository. Serve il segreto EXPO_TOKEN in questo repository (vedi docs/app.md).
name: Store (TestFlight e Google Play)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Piattaforma
        type: choice
        options: [ios, android, all]
        default: ios
      submit:
        description: Invia allo store dopo la build (TestFlight interno / Play «internal» in bozza)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: store
  cancel-in-progress: false

jobs:
  eas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: app-mobile } }
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EAS: npx -y eas-cli@24.8.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.3.0, cache: npm, cache-dependency-path: app-mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - name: Accesso a Expo
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error::Manca il segreto EXPO_TOKEN (Settings → Secrets and variables → Actions). Vedi docs/app.md"; exit 1; }
          $EAS whoami
      - name: Chiave Apple da Expo, app su App Store Connect, progetto Expo
        id: prep
        run: node scripts/store-prep.mjs
      - name: Build firmata${{ inputs.submit && ' e invio' || '' }}
        env:
          EAS_NO_VCS: "1"
          EXPO_PROJECT_ID: ${{ steps.prep.outputs.project_id }}
          EXPO_ASC_API_KEY_PATH: ${{ steps.prep.outputs.p8 }}
          EXPO_ASC_KEY_ID: ${{ steps.prep.outputs.key_id }}
          EXPO_ASC_ISSUER_ID: ${{ steps.prep.outputs.issuer }}
          EXPO_APPLE_TEAM_ID: BX9MDXAHKG
          EXPO_APPLE_TEAM_TYPE: ${{ steps.prep.outputs.team_type }}
          ASC_APP_ID: ${{ steps.prep.outputs.asc_app_id }}
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          for p in $( [ "$PLATFORM" = all ] && echo "ios android" || echo "$PLATFORM" ); do
            sub=""; if [ "$SUBMIT" = "true" ] && { [ "$p" = android ] || [ -n "$ASC_APP_ID" ]; }; then sub="--auto-submit"; fi
            [ "$p" = android ] && sub=""   # Google vuole il primo AAB caricato a mano in Play Console: invio automatico dalla seconda build
            echo "== $p $sub"
            $EAS build --platform "$p" --profile production $sub --non-interactive --no-wait
          done
          echo "### Build avviate su Expo ($PLATFORM)" >> "$GITHUB_STEP_SUMMARY"
          echo "Stato e log: https://expo.dev/accounts/gianpaolobol/projects/pianta-libera/builds" >> "$GITHUB_STEP_SUMMARY"
      - name: Rimuovi la chiave temporanea
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
