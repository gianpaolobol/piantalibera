name: Demo su GitHub Pages
# Pubblica public/ (editor statico) sul branch gh-pages a ogni push su main.
# GitHub Pages serve il branch gh-pages: https://gianpaolobol.github.io/piantalibera/
# (Settings → Pages → Source: "Deploy from a branch", branch gh-pages, cartella /).
# Su Pages non c'è /api/render: la scheda Render AI dice che il servizio non è disponibile.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/build-editor.mjs --check
      - name: Pubblica public/ sul branch gh-pages
        run: |
          cd public
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo da ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
