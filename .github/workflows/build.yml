name: Build e test
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Editor aggiornato rispetto ai sorgenti
        run: npm run build
      - name: Test del Worker e del contratto
        run: npm run test:unit
      - name: Browser per i test
        run: npx playwright install --with-deps chromium
      - name: Test dell'editor nel browser
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
