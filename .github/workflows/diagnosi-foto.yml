# Diagnosi di «Da foto al 3D» su foto vere: segmentazione (come nel browser), spigoli, Llama 4 Scout + DETR
# su Workers AI (REST API, nessun deploy) e unione; immagini annotate nel log. scripts/diagnosi-foto.mjs resta
# per provare solo i modelli del server.
# Parte da sola sui rami feature/foto-* quando cambiano il contratto o lo script; a mano da Actions.
name: Diagnosi foto 3D

on:
  workflow_dispatch:
    inputs:
      n: { description: "Quante foto", default: "3" }
  push:
    branches: ["feature/foto-*"]
    paths: ["shared/photo.js", "scripts/diagnosi-foto.mjs", "scripts/sonda-seg.mjs", "shared/photo-seg.js", ".github/workflows/diagnosi-foto.yml"]

permissions:
  contents: read

concurrency:
  group: diagnosi-foto
  cancel-in-progress: true

jobs:
  diagnosi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      N: ${{ inputs.n || '3' }}
      IDX: "2,6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save @huggingface/transformers@3.8.1 sharp@0.34.4
      - run: node scripts/sonda-seg.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diagnosi-foto, path: diagnosi-foto/, retention-days: 14 }
