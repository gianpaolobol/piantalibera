# Diagnosi di «Da foto al 3D» sui modelli veri di Workers AI (REST API, nessun deploy).
# Parte da sola sui rami feature/foto-* quando cambiano il contratto o lo script; a mano da Actions.
name: Diagnosi foto 3D

on:
  workflow_dispatch:
    inputs:
      n: { description: "Quante foto", default: "3" }
  push:
    branches: ["feature/foto-*"]
    paths: ["shared/photo.js", "scripts/diagnosi-foto.mjs", "scripts/sonda-moondream.mjs", ".github/workflows/diagnosi-foto.yml"]

permissions:
  contents: read

concurrency:
  group: diagnosi-foto
  cancel-in-progress: true

jobs:
  diagnosi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      N: ${{ inputs.n || '3' }}
      SOLO_SONDA: "1"
      MODELS: "glm=@cf/zai-org/glm-5.3-flash,gemma=@cf/google/gemma-4-26b-a4b-it"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save sharp@0.34.4
        if: hashFiles('scripts/sonda-moondream.mjs') != ''
      - run: node scripts/sonda-moondream.mjs
        if: hashFiles('scripts/sonda-moondream.mjs') != ''
      - run: node scripts/diagnosi-foto.mjs
        if: env.SOLO_SONDA != '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diagnosi-foto, path: diagnosi-foto/, retention-days: 14 }
