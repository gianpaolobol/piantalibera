name: Livelli di qualità
# Misura gli indicatori di docs/livelli-qualita.md e li scrive nel riepilogo dell'esecuzione.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  misura:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci && npm i --no-save axe-core@4
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.livelli.config.mjs
      - name: Banco CAD → BIM (piante sintetiche, docs/banco-cad.md)
        run: node scripts/banco-cad.mjs --n 25 --json test-results/banco-cad.json | tee banco-cad.txt
      - run: pip install -q ifcopenshell ezdxf
      - name: Validazione IFC e DXF
        run: python3 -I scripts/valida-ifc-dxf.py | tee validazione.txt
        continue-on-error: true
      - name: Riepilogo
        run: |
          { echo "## Livelli di qualità — valori misurati"; echo; echo '```json'; cat test-results/livelli.json; echo '```'; echo; echo '```'; cat validazione.txt; echo '```'; echo; cat banco-cad.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: livelli, path: test-results/, retention-days: 30 }
