<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>Pianta Libera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: banco da disegno a tre colonne — attrezzi | pianta + modello | ispettore; su telefono si impila */
:root{
  --bg:#e9ece8; --panel:#f6f7f4; --line:#cdd3cc; --ink:#1d2320; --muted:#5f6a63;
  --accent:#1f6f62; --accent-ink:#ffffff; --accent-soft:#d6e8e3; --warn:#9a5b12; --danger:#a33a2b; --ok:#2f7a3c;
  --plan-bg:#fbfbf8; --plan-grid:#e8ebe5; --plan-grid-major:#d3d9d1; --plan-poche:#2a302c; --plan-room:#eef2ea;
  --plan-text:#2a302c; --plan-ghost:#b9c1b9; --plan-sel:#1f6f62; --plan-under:#6a7a8a; --plan-green:#7f9a6a;
  --f-ui:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141917; --panel:#1b211e; --line:#2e3833; --ink:#e3e8e4; --muted:#9aa8a0;
  --accent:#5bbfa9; --accent-ink:#0c1512; --accent-soft:#1f3a33; --warn:#e0a458; --danger:#e07a6a; --ok:#7cc48a;
  --plan-bg:#101412; --plan-grid:#1a201d; --plan-grid-major:#26302b; --plan-poche:#d8ded9; --plan-room:#17201c;
  --plan-text:#d8ded9; --plan-ghost:#3a4641; --plan-sel:#5bbfa9; --plan-under:#8aa0b5; --plan-green:#6f8f5c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1b211e; --line:#2e3833; --ink:#e3e8e4; --muted:#9aa8a0;
  --accent:#5bbfa9; --accent-ink:#0c1512; --accent-soft:#1f3a33; --warn:#e0a458; --danger:#e07a6a; --ok:#7cc48a;
  --plan-bg:#101412; --plan-grid:#1a201d; --plan-grid-major:#26302b; --plan-poche:#d8ded9; --plan-room:#17201c;
  --plan-text:#d8ded9; --plan-ghost:#3a4641; --plan-sel:#5bbfa9; --plan-under:#8aa0b5; --plan-green:#6f8f5c; color-scheme:dark }
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;margin:0}
*{box-sizing:border-box}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand b{font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand small{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.field{display:flex;align-items:center;gap:6px}
.field label,.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.inp,select.inp{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-width:0}
.inp:focus{border-color:var(--accent)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel);border:0;padding:5px 10px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.spacer{flex:1}
.main{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr 320px;gap:8px}
.tools{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px}
.tool{width:44px;height:44px;border:1px solid transparent;border-radius:4px;background:transparent;display:grid;place-items:center;position:relative}
.tool svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6}
.tool:hover{background:var(--bg)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tool kbd{position:absolute;right:3px;bottom:2px;font-family:var(--f-data);font-size:9px;color:var(--muted)}
.tool-sep{height:1px;background:var(--line);margin:3px 2px}
.views{min-width:0;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.views[data-mode="2d"],.views[data-mode="3d"]{grid-template-columns:1fr}
.views[data-mode="2d"] #pane3d,.views[data-mode="3d"] #pane2d{display:none}
.pane{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--plan-bg)}
.pane canvas{display:block;width:100%;height:100%;touch-action:none}
.pane-tag{position:absolute;left:8px;top:8px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:color-mix(in srgb, var(--panel) 85%, transparent);padding:3px 6px;border-radius:3px;pointer-events:none}
.hud{position:absolute;left:8px;bottom:8px;right:8px;font-family:var(--f-data);font-size:11px;color:var(--muted);pointer-events:none;display:flex;gap:12px;flex-wrap:wrap}
.hud span{background:color-mix(in srgb, var(--panel) 88%, transparent);padding:3px 6px;border-radius:3px}
.cam{position:absolute;right:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 90px)}
.cam .btn{padding:3px 8px;font-size:12px;background:color-mix(in srgb, var(--panel) 92%, transparent)}
.loading3d{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-family:var(--f-data);font-size:11px;background:var(--panel);border:1px solid var(--line);padding:4px 8px;border-radius:3px;color:var(--muted)}
.compare{position:absolute;inset:0;background:var(--plan-bg);display:flex;flex-direction:column;z-index:5}
.compare .stage{position:relative;flex:1;min-height:0;overflow:hidden}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.compare .after{clip-path:inset(0 0 0 var(--cut,50%))}
.compare .divider{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:2px;background:var(--accent);pointer-events:none}
.compare .ctl{display:flex;gap:8px;align-items:center;padding:8px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.compare input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:transparent;border:0;padding:9px 2px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;font-size:12.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f .inp{width:100%}
.f input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px}
.chk input{accent-color:var(--accent)}
#panel-ai .chk{align-items:flex-start}#panel-ai .chk input{margin-top:3px}
.ts{min-height:65px;margin:6px 0;max-width:100%;overflow:hidden}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.note b{color:var(--ink)}
.note.warn{color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.cats{display:flex;flex-wrap:wrap;gap:4px}
.cats button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 9px;font-size:12px}
.cats button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.grid-lib{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid-lib button{text-align:left;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);min-width:0}
.grid-lib button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.grid-lib small{display:block;color:var(--muted);font-family:var(--f-data);font-size:10.5px;margin-top:2px}
.grid-lib .badge{display:inline-block;font-size:9.5px;font-family:var(--f-data);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:4px;color:var(--muted)}
.grid-online{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.grid-online button{padding:0;border:1px solid var(--line);border-radius:4px;background:var(--bg);overflow:hidden;text-align:left;min-width:0}
.grid-online img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--line)}
.grid-online span{display:block;font-size:10.5px;padding:3px 5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.sw{border:1px solid var(--line);border-radius:4px;padding:0;background:var(--bg);overflow:hidden;text-align:left}
.sw i{display:block;height:28px;background-size:cover;background-position:center}
.sw span{display:block;font-size:10.5px;padding:3px 4px;line-height:1.2}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-1px}
textarea.inp{width:100%;min-height:110px;resize:vertical;font-size:12px;line-height:1.4}
textarea.code{font-family:var(--f-data);font-size:11px;min-height:170px}
.exp{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.exp h4{margin:0;font-size:13px;font-weight:600}
.exp header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
details.exp summary{cursor:pointer;font-weight:600;font-size:13px}
.tag{font-family:var(--f-data);font-size:10.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips code{font-family:var(--f-data);font-size:10.5px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:1px 4px;cursor:pointer}
.layers{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gallery figure{margin:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.gallery img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;cursor:pointer}
.gallery figcaption{font-size:10.5px;padding:4px 6px;display:flex;justify-content:space-between;gap:4px;color:var(--muted);font-family:var(--f-data)}
.gallery figcaption button{border:0;background:transparent;color:var(--accent);padding:0;font-size:11px}
pre.raw{margin:0;max-height:160px;overflow:auto;font-family:var(--f-data);font-size:10.5px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px;white-space:pre-wrap;word-break:break-all}
.mlist{display:flex;flex-direction:column;gap:6px}
.mlist .mi{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center}
.mlist .mi i{width:36px;height:28px;border-radius:3px;border:1px solid var(--line);background-size:cover}
.status{font-family:var(--f-data);font-size:11px}
.status.ok{color:var(--ok)} .status.err{color:var(--danger)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
#toast.err{background:var(--danger);color:#fff}
@media (max-width: 1080px){
  .main{grid-template-columns:auto 1fr}
  .side{grid-column:1 / -1}
  #app{height:auto;min-height:100%}
  .views{height:72vh}
}
@media (max-width: 640px){
  .main{grid-template-columns:1fr}
  .tools{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .tool-sep{width:1px;height:auto;margin:2px 3px}
  .views{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:120vh}
  .views[data-mode="2d"],.views[data-mode="3d"]{grid-template-rows:1fr;height:75vh}
  .brand small{display:none}
}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
</style>

<div id="app">
  <header class="bar">
    <div class="brand"><b>Pianta Libera</b><small>pianta → 3D → D5 · AI · stampa</small></div>
    <div class="field"><label for="projName">Progetto</label><input id="projName" class="inp" style="width:170px"></div>
    <div class="field"><label for="levelSel">Piano</label><select id="levelSel" class="inp"></select>
      <button id="addLevel" class="btn" title="Aggiungi un piano sopra l'ultimo">+ Piano</button></div>
    <div class="spacer"></div>
    <div class="seg" id="viewSeg" role="group" aria-label="Viste">
      <button data-v="2d">Pianta</button><button data-v="3d">3D</button><button data-v="both" aria-pressed="true">Affiancate</button>
    </div>
    <div class="seg"><button id="undoBtn" title="Annulla (Ctrl+Z)">Annulla</button><button id="redoBtn" title="Ripristina (Ctrl+Y)">Ripristina</button></div>
  </header>

  <div class="main">
    <nav class="tools" id="tools" aria-label="Strumenti">
      <button class="tool" data-tool="select" title="Seleziona e sposta (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><kbd>V</kbd></button>
      <div class="tool-sep"></div>
      <button class="tool" data-tool="wall" title="Muro (W) — clic per clic, Esc per finire, digita una misura + Invio"><svg viewBox="0 0 24 24"><path d="M3 18h18M3 14h18"/><path d="M6 14v4M12 14v4M18 14v4"/></svg><kbd>W</kbd></button>
      <button class="tool" data-tool="rect" title="Stanza rettangolare con muri (R) — trascina"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14"/><rect x="6.5" y="7.5" width="11" height="9" stroke-dasharray="2 2"/></svg><kbd>R</kbd></button>
      <button class="tool" data-tool="room" title="Pavimento a poligono (P) — clic sui vertici, Invio per chiudere"><svg viewBox="0 0 24 24"><path d="M4 18L6 6l9-2 5 9-6 6z"/></svg><kbd>P</kbd></button>
      <button class="tool" data-tool="door" title="Porta (D) — clic su un muro"><svg viewBox="0 0 24 24"><path d="M5 19h14"/><path d="M7 19V8"/><path d="M7 8a11 11 0 0 1 11 11"/></svg><kbd>D</kbd></button>
      <button class="tool" data-tool="window" title="Finestra (F) — clic su un muro"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6"/><path d="M3 12h18"/></svg><kbd>F</kbd></button>
      <button class="tool" data-tool="furn" title="Arredi, verde e persone (A)"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="6" rx="1"/><path d="M6 10V7h12v3M6 16v2M18 16v2"/></svg><kbd>A</kbd></button>
      <div class="tool-sep"></div>
      <button class="tool" data-tool="calib" title="Calibra la base di ricalco (C) — due punti e una misura"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><kbd>C</kbd></button>
      <button class="tool" data-tool="moveunder" title="Sposta la base di ricalco (M)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><kbd>M</kbd></button>
    </nav>

    <section class="views" id="views" data-mode="both">
      <div class="pane" id="pane2d"><canvas id="c2d" aria-label="Pianta"></canvas><div class="pane-tag" id="tag2d">Pianta</div><div class="hud" id="hud2d"></div></div>
      <div class="pane" id="pane3d"><canvas id="c3d" aria-label="Modello 3D"></canvas><div class="pane-tag">Modello 3D</div>
        <div class="cam">
          <button class="btn" data-cam="ext">Esterno</button><button class="btn" data-cam="bird">Volo d'uccello</button><button class="btn" data-cam="int">Interno</button><button class="btn" data-cam="top">Dall'alto</button>
        </div>
        <div class="loading3d" id="loading3d" hidden></div>
        <div class="hud" id="hud3d"></div>
        <div class="compare" id="compare" hidden>
          <div class="stage" id="cmpStage"><img id="cmpBefore" alt="Vista 3D di partenza"><img id="cmpAfter" class="after" alt="Render AI"><div class="divider"></div></div>
          <div class="ctl"><span class="lbl">Prima</span><input type="range" id="cmpCut" min="0" max="100" value="50" aria-label="Confronto prima e dopo"><span class="lbl">Dopo</span><button class="btn" id="cmpSave">Salva render</button><button class="btn" id="cmpClose">Chiudi</button></div>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="props" aria-selected="true">Proprietà</button>
        <button role="tab" data-tab="import" aria-selected="false">Importa</button>
        <button role="tab" data-tab="export" aria-selected="false">Esporta</button>
        <button role="tab" data-tab="ai" aria-selected="false">Render AI</button>
      </div>
      <div class="panel" id="panel-props"></div>
      <div class="panel" id="panel-import" hidden></div>
      <div class="panel" id="panel-export" hidden></div>
      <div class="panel" id="panel-ai" hidden></div>
    </aside>
  </div>
  <div id="toast" role="status"></div>
  <input type="file" id="fPlan" accept=".dxf,.pdf,.png,.jpg,.jpeg,.webp" hidden>
  <input type="file" id="fModel" accept=".dae,.zip,.glb,.gltf,.bin,.obj,.mtl,.fbx,.3ds,.stl,.png,.jpg,.jpeg,.tga,.bmp,.webp" multiple hidden>
  <input type="file" id="fProj" accept=".json" hidden>
  <input type="file" id="fTex" accept=".png,.jpg,.jpeg,.webp" hidden>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>

<script>
/* ---- 01-base.js ---- */
"use strict";
/* ============================================================

const UP = new THREE.Vector3(0,1,0);
function cylBetween(a, b, ra, rb, seg){

}

}

function makeTree(spKey, seed=1){

}
function clean2(g){ g = g.index ? g.toNonIndexed() : g; return g; }
function makeCypress(R){

function makePalm(R){

function makeShrub(kind, R){

const TPL = {};
function finishTpl(G){
  G.traverse(o => {
    if (!o.isMesh) return; o.castShadow = true; o.receiveShadow = !o.userData.leaves;
    if (o.userData.wuv){ const k = (Array.isArray(o.material) ? o.material[0] : o.material).userData.key; o.geometry = worldUV(o.geometry.index ? o.geometry.toNonIndexed() : o.geometry, matDef(k).size || .5); }
    if (o.material?.alphaTest > 0) o.customDepthMaterial = new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking, map:o.material.map, alphaTest:o.material.alphaTest});
  });
  G.userData.box = null; return G;
}
function libRef(ref){ return LIBMAP[ref] ? ref : (LIB_ALIASES[ref] || ref); }
function objTemplate(o){
  if (o.kind === "lib"){
    const ref = libRef(o.ref), it = LIBMAP[ref]; if (!it) return null;
    const t = TPL[ref];
    if (t?.status === "ok") return t.obj;
    if (it.build && !t){ TPL[ref] = {status:"ok", obj:finishTpl(it.build())}; return TPL[ref].obj; }
    if (it.load && !t) loadTpl(ref);
    return null;
  }
  return importStore[o.ref]?.obj || null;
}
let tplPending = 0;
async function loadTpl(ref){
  TPL[ref] = {status:"loading"}; tplPending++; busy(`Carico ${LIBMAP[ref].nome}…`);
  try { TPL[ref] = {status:"ok", obj:finishTpl(await LIBMAP[ref].load())}; }
  catch(e){ TPL[ref] = {status:"err"}; console.warn(e); toast(`Non riesco a caricare «${LIBMAP[ref].nome}»: manca la cartella assets accanto alla pagina?`, true); }
  tplPending--; if (!tplPending) busy(""); rebuild3D(); draw2D(); if (S.tab === "props") renderInspector();
}
function objFootprint(o){
  const t = objTemplate(o); if (!t) return {w:.8, d:.8, cx:0, cz:0};
  if (!t.userData.box) t.userData.box = new THREE.Box3().setFromObject(t);
  const b = t.userData.box, s = o.scale || 1; return {w:(b.max.x-b.min.x)*s, d:(b.max.z-b.min.z)*s, cx:(b.max.x+b.min.x)/2*s, cz:(b.max.z+b.min.z)/2*s, h:(b.max.y-b.min.y)*s};
}

async function loadPersonalIndex(){
  let idx; try { idx = await fetchJSON(ASSET + "personale/indice.json", 6000); } catch(e){ return; }
  if (!Array.isArray(idx) || !idx.length) return;
  for (const it of idx){
    if (!it.file) continue; const cat = it.categoria || "Personale", ref = "pers_" + slugify(it.file);
    if (LIBMAP[ref]) continue;
    const entry = {cat, ref, nome:it.nome || it.file, dim: it.altezza ? `h ${Math.round(it.altezza*100)}` : "", real:true, credit:it.crediti || "Libreria personale", plan: cat === "Persone" ? "person" : cat === "Verde" ? "tree" : undefined, load:() => loadPersonalModel({file:it.file, h:it.altezza})};
    LIB.push(entry); LIBMAP[ref] = entry;
  }
  LIB_CATS = [...new Set(LIB.map(x => x.cat))];
  if (S.tool === "furn") renderInspector(); draw2D(); rebuild3D();
}

let composer = null, ssao = null;
function ensureComposer(){
  if (composer) return composer;
  const size = renderer.getSize(new THREE.Vector2());
  composer = new THREE.EffectComposer(renderer);
  ssao = new THREE.SSAOPass(scene, camera, size.x, size.y);
  ssao.kernelRadius = .6; ssao.minDistance = .0008; ssao.maxDistance = .03;
  const ov = ssao.overrideVisibility.bind(ssao);
  ssao.overrideVisibility = function(){ ov(); this.scene.traverse(o => { if (o.userData?.leaves || o.material?.transparent) o.visible = false; }); };
  composer.addPass(ssao);
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  return composer;
}
function drawFrame(useHQ = S.hq){
  if (useHQ){ ensureComposer(); const s = renderer.getSize(new THREE.Vector2()); composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(s.x, s.y); composer.render(); }
  else renderer.render(scene, camera);

const PH = "https://api.polyhaven.com";

async function fetchJSON(url, ms=12000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, {signal:ctl.signal}); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

function normalizeObject(raw, k=1, up="y"){
  const holder = new THREE.Group(); holder.add(raw); stripLights(raw);
  if (up === "z") raw.rotation.x -= Math.PI/2;
  raw.scale.multiplyScalar(k); holder.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(holder), c = box.getCenter(new THREE.Vector3());
  raw.position.x -= c.x; raw.position.z -= c.z; raw.position.y -= box.min.y;
  holder.traverse(o => { if (o.isMesh){ o.castShadow = o.receiveShadow = true; } });
  holder.userData.box = null; return holder;
}
async function loadPolyHavenModel(id){
  const f = await fetchJSON(`${PH}/files/${id}`);
  const g = f.gltf?.["1k"]?.gltf || f.gltf?.["2k"]?.gltf; if (!g) throw new Error("modello senza glTF");
  const inc = g.include || {};
  const manager = new THREE.LoadingManager();
  manager.setURLModifier(u => { for (const [rel, v] of Object.entries(inc)) if (u.endsWith(rel) || u.endsWith(rel.split("/").pop())) return v.url; return u; });
  const gl = await loadGLTF(g.url, manager);
  gl.scene.traverse(o => { if (o.isMesh){ (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.envMapIntensity = .7); } });
  return normalizeObject(gl.scene);
}
async function loadPersonalModel(pick){
  const url = ASSET + "personale/" + pick.file, ext = pick.file.split(".").pop().toLowerCase(); let raw;
  if (ext === "glb" || ext === "gltf") raw = (await loadGLTF(url)).scene;
  else if (ext === "fbx"){ await loadFBXLibs(); raw = await new Promise((res, rej) => new THREE.FBXLoader().load(url, res, undefined, rej)); }
  else throw new Error("formato non supportato nella libreria personale: ." + ext);
  let k = 1; if (pick.h){ const b = new THREE.Box3().setFromObject(raw); k = pick.h / Math.max(.01, b.max.y - b.min.y); }
  else if (ext === "fbx"){ const b = new THREE.Box3().setFromObject(raw); if (b.max.y - b.min.y > 30) k = .01; }
  return normalizeObject(raw, k);
}
async function placeRemoteModel(pick, p){

      importStore[id] = {obj, file:null, source:{type: pick.src === "ph" ? "polyhaven" : "personal", id, file:pick.file, h:pick.h, nome:pick.nome, credit: pick.src === "ph" ? "Poly Haven · CC0" : pick.credit}};

    }
    const o = {id:uid(), level:S.level, kind:"import", ref:id, name:pick.nome, x:p[0], y:p[1], rot:0, scale:1, z:0};
    P.objects.push(o); S.sel = {type:"object", id:o.id}; commit();

}
async function restoreRemote(id, src){

let downloadsCap = null; const ALLOWED = ["png","json","txt","zip","html","svg","md","csv","pdf","jpg"];

const inArtifact = () => !!downloadsCap;
async function saveFile(name, data){
  const ext = name.split(".").pop().toLowerCase();
  let blob = data instanceof Blob ? data : new Blob([data]);

    if (!ALLOWED.includes(ext)){ const buf = new Uint8Array(await blob.arrayBuffer()); blob = new Blob([fflate.zipSync({[name]: buf})]); name = name + ".zip"; }
    try { await downloadsCap.save({filename:name, data:blob}); toast("Salvato: " + name); }
    catch(e){ if (e?.code !== "declined") toast("Salvataggio non riuscito: " + (e?.message || e?.code), true); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast("Scaricato: " + name);
}
const slug = () => slugify(P.name || "progetto");
const zipNeeded = ext => inArtifact() && !ALLOWED.includes(ext);

function aiStatus(msg, cls=""){ const s = $("#aiStatus"); if (s){ s.textContent = msg; s.className = "status " + cls; } }
const getPath = (obj, path) => !path ? obj : path.split(".").reduce((o, k) => o == null ? undefined : o[/^\d+$/.test(k) ? +k : k], obj);
function fillTemplate(tpl, vars){
  return tpl.replace(/\{\{\s*([a-z_]+)\s*\}\}/gi, (_, k) => { const v = vars[k]; if (v === undefined) return ""; if (typeof v === "number") return String(v); if (typeof v === "object") return JSON.stringify(v); return JSON.stringify(String(v)).slice(1, -1); });
}
function aiBaseUrl(){ try { return new URL(aiConfig().url || "/", location.href).href; } catch(e){ return location.href; } }
function findImages(x, out=[]){
  if (out.length > 8 || x == null) return out;
  if (typeof x === "string"){ if (/^data:image\//.test(x)) out.push(x); else if (/^https?:\/\/\S+/.test(x) && /(\.png|\.jpe?g|\.webp)(\?|$)|\/(output|image|result|file|download)/i.test(x)) out.push(x); else if (x.length > 2000 && /^[A-Za-z0-9+/=\s]+$/.test(x.slice(0, 200))) out.push("data:image/png;base64," + x.replace(/\s/g,"")); return out; }
  if (Array.isArray(x)){ x.forEach(v => findImages(v, out)); return out; }
  if (typeof x === "object") for (const v of Object.values(x)) findImages(v, out);
  return out;
}
function toImageList(v){ if (v == null) return []; if (Array.isArray(v)) return v.flatMap(toImageList); if (typeof v === "object") return findImages(v); const s = String(v); if (/^(data:|https?:|blob:)/.test(s)) return [s]; if (/^(\/|\.\.?\/)[^\s]*$/.test(s) || /^[\w.-]+\.php\?/.test(s)) return [new URL(s, aiBaseUrl()).href]; return ["data:image/png;base64," + s]; }
async function buildVars(cfg, test){
  const size = renderer.getSize(new THREE.Vector2()), long = test ? 256 : (cfg.longSide || 1536);
  const opts = {longSide: long};
  const beauty = renderAt(1, null, {...opts, hq:true});
  const guides = cfg.guides !== false;
  const need = k => guides && (cfg.template || "").includes(k);
  const outL = clamp(+cfg.outLongSide || long, 256, 1920), ar = size.x / size.y;
  const ow = Math.round((ar >= 1 ? outL : outL*ar)/16)*16, oh = Math.round((ar >= 1 ? outL/ar : outL)/16)*16;
  const depth = need("depth") ? depthCanvas(1, opts) : null, lines = need("lines") ? linesCanvas(1, opts) : null, mats = need("materials") ? materialsCanvas(1, opts) : null;
  const d64 = c => c ? c.toDataURL("image/png") : "";
  const vars = {image_dataurl:d64(beauty), depth_dataurl:d64(depth), lines_dataurl:d64(lines), materials_dataurl:d64(mats?.canvas), materials_legend:JSON.stringify(mats?.legend || {}),
    prompt: cfg.prompt || aiPrompt(), negative: cfg.negative || "", model: cfg.model || "", strength: +cfg.strength || .4, steps: +cfg.steps || 30, guidance: +cfg.guidance || 6,
    seed: (+cfg.seed >= 0 ? +cfg.seed : Math.floor(Math.random()*2**31)), variants: clamp(+cfg.variants || 1, 1, 8), width: clamp(ow, 256, 1920), height: clamp(oh, 256, 1920), use_guides: guides,
    w_depth: +cfg.w_depth || 0, w_lines: +cfg.w_lines || 0, w_seg: +cfg.w_seg || 0, project: P.name,
    render_mode: cfg.renderMode === "creativo" ? "creativo" : "fedele", scene: S.show3d === "all" && camera.position.y > level().elev + 2.2 ? "esterni" : (camera.fov > 55 ? "interni" : "esterni"),
    camera: {position:camera.position.toArray().map(v=>+v.toFixed(3)), target:controls.target.toArray().map(v=>+v.toFixed(3)), fov:camera.fov, aspect:+camera.aspect.toFixed(4), units:"m", up:"y"}};
  for (const k of ["image","depth","lines","materials"]) vars[k] = (vars[k + "_dataurl"] || "").replace(/^data:image\/png;base64,/, "");
  vars._canvases = {image:beauty, depth, lines, materials:mats?.canvas};
  return vars;
}
function aiConfig(){ return AI.mode === "base" ? {...AI.base, negative:"", variants:1, steps:30, guidance:6, seed:-1} : AI.adv; }
async function previewAI(){
  const cfg = aiConfig(); const vars = await buildVars(cfg, true); const short = {...vars}; for (const k of Object.keys(short)) if (typeof short[k] === "string" && short[k].length > 80) short[k] = short[k].slice(0, 40) + `…(${short[k].length} caratteri)`;
  delete short._canvases; aiLastRaw = "Corpo inviato (immagini abbreviate):\n" + fillTemplate(cfg.template, short); renderAI();
}
async function aiFetch(cfg, url, init){
  try { return await fetch(url, init); }
  catch(e){ throw new Error(inArtifact() ? "la connessione è bloccata: l'anteprima dentro Claude non permette chiamate a servizi esterni. Usa la versione caricata sul tuo sito." : "il servizio non risponde o non accetta richieste da questa pagina (CORS). Con la connessione «Tramite il mio sito» il problema non si pone."); }
}
async function readBody(r){ const ct = r.headers.get("content-type") || ""; if (ct.startsWith("image/")){ const b = await r.blob(); return {image:URL.createObjectURL(b)}; } const t = await r.text(); try { return JSON.parse(t); } catch(_){ return {text:t}; } }
async function runAI(test){
  if (aiBusy) return; const cfg = aiConfig();
  const endpoint = cfg.url;
  if (!endpoint){ aiStatus("Inserisci l'endpoint: /api/render per il backend del progetto, oppure l'indirizzo di un servizio per una prova locale.", "err"); return; }
  const viaBackend = isBackendCfg(cfg);
  if (viaBackend){
    if (!aiConsent){ aiStatus("Per generare il render serve il consenso all'invio delle immagini al servizio (casella sopra).", "err"); return; }
    if (backendCfg.data?.enabled === false){ aiStatus("Render AI non attivo su questo sito" + (backendCfg.data.reason ? ` (${backendCfg.data.reason})` : "") + ".", "err"); return; }
    if (backendCfg.data?.turnstile_site_key && !tsToken){ aiStatus("Completa la verifica anti-bot sopra, poi riprova.", "err"); return; }
  }
  const token = tsToken;
  aiBusy = true; renderAI(); aiStatus(test ? "Provo la connessione con un'immagine piccola…" : "Preparo vista, profondità e contorni…");
  try {
    const vars = await buildVars(cfg, test);
    vars.consent = viaBackend ? aiConsent : false; vars.turnstile = viaBackend ? token : "";
    const headers = {};
    if (cfg.authValue) headers[cfg.authHeader || "Authorization"] = cfg.authValue;
    for (const line of (cfg.extraHeaders || "").split(/\n|;/)){ const m = line.match(/^\s*([^:]+):\s*(.+)$/); if (m) headers[m[1].trim()] = m[2].trim(); }
    let body;
    if (cfg.contentType === "multipart"){
      const spec = JSON.parse(fillTemplate(cfg.template, vars)); const fd = new FormData();
      for (const [k, v] of Object.entries(spec)){
        if (typeof v === "string" && v.startsWith("@") && vars._canvases[v.slice(1)]){ const c = vars._canvases[v.slice(1)]; fd.append(k, await new Promise(r => c.toBlob(r, "image/png")), v.slice(1) + ".png"); }
        else fd.append(k, typeof v === "object" ? JSON.stringify(v) : String(v));
      }
      body = fd;
    } else { body = fillTemplate(cfg.template, vars); try { JSON.parse(body); } catch(err){ throw new Error("il modello della richiesta non è un JSON valido: " + err.message); } headers["Content-Type"] = "application/json"; }
    aiStatus("Invio al servizio…");
    const t0 = Date.now(); let r = await aiFetch(cfg, endpoint, {method:"POST", headers, body}); let data = await readBody(r);
    if (viaBackend){ tsToken = ""; const q = r.headers.get("x-quota-remaining"); if (q !== null && q !== "") aiQuotaLeft = +q; }
    aiLastRaw = `HTTP ${r.status}\n` + JSON.stringify(data, (k,v) => typeof v === "string" && v.length > 300 ? v.slice(0,120) + `…(${v.length})` : v, 2).slice(0, 6000);
    if (!r.ok){ const code = data?.error?.code, msg = data?.error?.message; throw new Error(code === "consent_required" ? "serve il consenso all'invio delle immagini" : code === "bot_check_failed" ? "verifica anti-bot non superata: ripetila e riprova" : code === "config_incomplete" ? "il servizio di render non è ancora configurato su questo sito" : r.status === 429 ? `quota esaurita${msg ? ": " + msg : ""}` : r.status === 503 ? `servizio di render sospeso${msg ? ": " + msg : ""}` : `il servizio ha risposto ${r.status}${code ? " (" + code + ")" : ""}${msg ? ": " + msg : ""}. Dettagli sotto.`); }
    // lavoro asincrono
    let pollUrl = cfg.pollUrlPath ? getPath(data, cfg.pollUrlPath) : (cfg.jobIdPath && cfg.pollTemplate ? fillTemplate(cfg.pollTemplate, {job:getPath(data, cfg.jobIdPath)}) : null);
    if (pollUrl){
      const done = (cfg.doneValues||"").split(",").map(s=>s.trim().toLowerCase()).filter(Boolean), fail = (cfg.failValues||"").split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
      const getH = {...headers}; delete getH["Content-Type"];
      while (true){
        const st = String(getPath(data, cfg.statusPath) ?? "").toLowerCase();
        if (done.includes(st)) break; if (fail.includes(st)) throw new Error("il servizio segnala un errore: " + st);
        if ((Date.now() - t0)/1000 > (cfg.timeout || 300)) throw new Error("tempo scaduto in attesa del risultato");
        aiStatus(`In elaborazione${st ? ` (${st})` : ""} · ${Math.round((Date.now()-t0)/1000)} s`);
        await sleep((cfg.interval || 2) * 1000);
        const u = pollUrl;
        r = await aiFetch(cfg, u, {headers:getH}); data = await readBody(r);
        aiLastRaw = `HTTP ${r.status} (stato)\n` + JSON.stringify(data, (k,v) => typeof v === "string" && v.length > 300 ? v.slice(0,120) + `…(${v.length})` : v, 2).slice(0, 6000);
        if (!r.ok) throw new Error(`lo stato del lavoro ha risposto ${r.status}`);
      }
    }
    const imgs = data.image ? [data.image] : (cfg.resultPath ? toImageList(getPath(data, cfg.resultPath)) : findImages(data));
    if (!imgs.length) throw new Error("nella risposta non trovo immagini. Indica il «Percorso del risultato» (dettagli sotto).");
    const before = vars.image_dataurl;
    const now = new Date().toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"});
    imgs.forEach(src => aiResults.unshift({src, before, time:now, mode: (data.mock ? "prova · " : "") + (vars.render_mode === "creativo" ? "creativo" : "fedele"), prompt:vars.prompt}));
    if (data.mock) toast("Risposta del servizio di prova: l'immagine è la vista inviata, non un render AI");
    aiBusy = false; renderAI(); aiStatus(test ? `Connessione riuscita: ${imgs.length} immagine ricevuta in ${Math.round((Date.now()-t0)/1000)} s.` : `${imgs.length} render ricevuti in ${Math.round((Date.now()-t0)/1000)} s.${data.mock ? " Servizio di prova: l'immagine è la vista inviata, non un render AI." : ""}`, "ok");
    if (!test) openCompare(aiResults[0]);
  } catch(err){ console.warn(err); aiBusy = false; renderAI(); aiStatus("Non riuscito: " + (err.message || err), "err"); }
  finally { if (isBackendCfg(cfg)) resetTurnstile(); }
}
function openCompare(r){ if (!r) return; $("#cmpBefore").src = r.before; $("#cmpAfter").src = r.src; $("#compare").hidden = false; $("#compare")._r = r; setCut(50); $("#cmpCut").value = 50; }
function setCut(v){ $("#cmpStage").style.setProperty("--cut", v + "%"); $("#cmpStage").querySelector(".after").style.clipPath = `inset(0 0 0 ${v}%)`; $("#cmpStage").querySelector(".divider").style.left = v + "%"; }
$("#cmpCut").addEventListener("input", e => setCut(+e.target.value));

}
