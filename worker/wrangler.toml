# Pianta Libera — editor statico + API /api/render su Cloudflare Workers
# Deploy: npx wrangler deploy --config worker/wrangler.toml   (vedi docs/deploy-cloudflare.md)
name = "pianta-libera"
main = "src/index.js"
compatibility_date = "2026-10-01"

# L'editor (public/) è servito come asset statico; il Worker gestisce solo /api/*
[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaGate"]

[[kv_namespaces]]
binding = "RENDER_KV"
id = "SOSTITUISCI_CON_ID_KV"     # npx wrangler kv namespace create RENDER_KV

[vars]
MODEL = "@cf/black-forest-labs/flux-2-klein-4b"
PER_IP_DAILY = "2"               # render al giorno per visitatore (deciso dal proprietario il 7/11/2026)
TEST_DAILY = "20"               # render al giorno per le prove automatiche (solo con il segreto TEST_TOKEN, creato e cancellato dal workflow «Prove dal vivo»)
MAX_CONCURRENT_PER_IP = "1"      # lavori contemporanei per IP
GLOBAL_DAILY = "50"              # render al giorno di tutti i visitatori insieme (il proprietario non conta)
NEURON_DAILY_BUDGET = "9500"     # tetto di spesa totale: Neurons stimati al giorno (10.000 sono gratuiti)
VISITOR_NEURON_BUDGET = "6100"   # parte dei visitatori (50 render a 1024×768); i restanti ~3.400 (≈28 render) sono sempre del proprietario
NEURONS_PER_OUTPUT_TILE = "26.05" # tariffe klein 4B, nov 2026: aggiornare se cambiano
NEURONS_PER_INPUT_TILE = "5.37"
KILL_SWITCH = "0"                # "1" sospende i render; in alternativa chiave KV config:kill = "1"
RETENTION_SECONDS = "3600"       # lavori e immagini cancellati dopo 1 ora (TTL di KV)
MAX_VARIANTS = "1"
MAX_INPUT_SIDE = "512"
PROVIDER_TIMEOUT_MS = "60000"
ALLOWED_ORIGINS = ""             # vuoto = solo lo stesso dominio
TURNSTILE_SITE_KEY = ""          # chiave pubblica del widget Turnstile (non è un segreto)
SHARE_ENABLED = "1"              # link per il cliente e commenti (progetti in KV per 30 giorni); "0" li disattiva
SHARE_DAILY_WRITES = "200"       # tetto globale di link, versioni e commenti al giorno: ogni operazione fa fino a 4 scritture KV (gratuite: 1.000/giorno)

# Segreti obbligatori (mai nel file; senza di essi il render resta disattivato):
#   npx wrangler secret put IP_SALT           --config worker/wrangler.toml   (stringa casuale ≥ 16 caratteri)
#   npx wrangler secret put TURNSTILE_SECRET  --config worker/wrangler.toml
# Solo sviluppo locale (wrangler dev): ALLOW_NO_TURNSTILE=1 in worker/.dev.vars
