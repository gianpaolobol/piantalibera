# Pianta Libera — editor statico + API /api/render su Cloudflare Workers
# Deploy: npx wrangler deploy --config worker/wrangler.toml   (vedi docs/deploy-cloudflare.md)
name = "pianta-libera"
main = "src/index.js"
compatibility_date = "2026-10-01"

# L'editor (public/) è servito come asset statico; il Worker gestisce solo /api/*
[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "RENDER_KV"
id = "SOSTITUISCI_CON_ID_KV"     # npx wrangler kv namespace create RENDER_KV

[vars]
MODEL = "@cf/black-forest-labs/flux-2-klein-4b"
PER_IP_DAILY = "2"          # render al giorno per IP: da tarare sui consumi reali
GLOBAL_DAILY = "50"         # tetto giornaliero complessivo (circa 5.500 Neurons a 1024x768)
KILL_SWITCH = "0"           # "1" sospende i render; in alternativa chiave KV config:kill = "1"
RETENTION_SECONDS = "3600"  # lavori e immagini cancellati dopo 1 ora
MAX_VARIANTS = "1"
ALLOWED_ORIGINS = ""        # vuoto = solo lo stesso dominio

# Segreti (mai nel file):  npx wrangler secret put TURNSTILE_SECRET   ·   npx wrangler secret put IP_SALT
